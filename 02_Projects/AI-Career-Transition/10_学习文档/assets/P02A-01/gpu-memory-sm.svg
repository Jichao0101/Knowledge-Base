<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#247a89"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a64ad"/></marker></defs><rect width="1500" height="1120" fill="#f8fafc"/><text x="40" y="48" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#193247" font-weight="bold">GPU芯片、SM与存储：把任务调度和数据访问分开看</text><text x="40" y="82" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">概念示意：常见独立式 NVIDIA GPU；省略 GPC、互连和内存控制器等细节</text><rect x="40" y="115" width="310" height="135" rx="13" fill="#f1eafa" stroke="#b6cbd6" stroke-width="2"/><text x="58" y="147" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">CPU / Host</text><text x="58" y="180" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">应用 → Runtime / Driver</text><text x="58" y="209" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">提交 kernel 与数据传输请求</text><rect x="40" y="315" width="310" height="115" rx="13" fill="#ffffff" stroke="#b6cbd6" stroke-width="2"/><text x="58" y="347" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">主机内存（系统 DRAM）</text><text x="58" y="380" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">输入、主机侧数据与回读结果</text><rect x="40" y="550" width="310" height="130" rx="13" fill="#fff3de" stroke="#b6cbd6" stroke-width="2"/><text x="58" y="582" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">设备显存（GDDR / HBM）</text><text x="58" y="615" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">GPU逻辑芯片之外的 DRAM</text><text x="58" y="644" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">可位于板上或同一封装中</text><polyline points="315,430 315,550" fill="none" stroke="#247a89" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)" /><text x="60" y="478" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">主机 ↔ 设备传输</text><text x="60" y="509" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#193247" font-weight="normal">互连 + DMA / 拷贝机制</text><rect x="400" y="115" width="1060" height="795" rx="20" fill="#eaf4f7" stroke="#247a89" stroke-width="3"/><text x="425" y="151" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#193247" font-weight="bold">GPU逻辑芯片边界：片上存储分布在芯片内部</text><rect x="620" y="180" width="630" height="90" rx="13" fill="#f1eafa" stroke="#b6cbd6" stroke-width="2"/><text x="638" y="212" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">GPU硬件调度</text><text x="638" y="245" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">将 kernel 的 blocks 安排到可用 SM</text><polyline points="350,180 620,220" fill="none" stroke="#8a64ad" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)" /><rect x="435" y="320" width="480" height="365" rx="13" fill="#ffffff" stroke="#b6cbd6" stroke-width="2"/><text x="453" y="352" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">SM 0：同类计算单元之一</text><rect x="455" y="370" width="440" height="62" rx="13" fill="#f1eafa" stroke="#b6cbd6" stroke-width="2"/><text x="473" y="402" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">Warp Scheduler：选择就绪warp</text><rect x="455" y="450" width="440" height="66" rx="13" fill="#e8f1ff" stroke="#b6cbd6" stroke-width="2"/><text x="473" y="482" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">CUDA Cores / Tensor Cores / LSU</text><rect x="455" y="540" width="200" height="115" rx="13" fill="#fff3de" stroke="#b6cbd6" stroke-width="2"/><text x="473" y="572" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">寄存器文件</text><text x="473" y="605" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">线程的工作状态</text><text x="473" y="634" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">计算操作数 / 累加值</text><rect x="675" y="540" width="220" height="115" rx="13" fill="#fff3de" stroke="#b6cbd6" stroke-width="2"/><text x="693" y="572" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">L1 / Shared</text><text x="693" y="605" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">缓存 / 显式工作区</text><text x="693" y="634" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">分工不同的片上资源</text><polyline points="675,432 675,450" fill="none" stroke="#8a64ad" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)" /><polyline points="555,516 555,540" fill="none" stroke="#247a89" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)" /><polyline points="785,516 785,540" fill="none" stroke="#247a89" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)" /><rect x="955" y="320" width="465" height="365" rx="13" fill="#ffffff" stroke="#b6cbd6" stroke-width="2"/><text x="973" y="352" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">SM 1 … SM N：重复的同类结构</text><rect x="975" y="385" width="425" height="75" rx="13" fill="#f1eafa" stroke="#b6cbd6" stroke-width="2"/><text x="993" y="417" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">Warp Scheduler</text><text x="993" y="450" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">选择本 SM 的就绪 warp</text><rect x="975" y="480" width="425" height="75" rx="13" fill="#e8f1ff" stroke="#b6cbd6" stroke-width="2"/><text x="993" y="512" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">多类执行单元</text><text x="993" y="545" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">CUDA Cores / Tensor Cores / LSU</text><rect x="975" y="575" width="425" height="80" rx="13" fill="#fff3de" stroke="#b6cbd6" stroke-width="2"/><text x="993" y="607" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">本 SM 的片上存储</text><text x="993" y="640" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">寄存器、L1 cache、shared memory</text><polyline points="780,270 780,295 675,295 675,320" fill="none" stroke="#8a64ad" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)" /><polyline points="1100,270 1100,295 1180,295 1180,320" fill="none" stroke="#8a64ad" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)" /><rect x="480" y="770" width="900" height="105" rx="13" fill="#fff3de" stroke="#b6cbd6" stroke-width="2"/><text x="498" y="802" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">L2 Cache：为多个 SM 服务的片上缓存</text><text x="498" y="835" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">SM 的 global-memory 访问与设备显存之间的缓存层级</text><polyline points="350,615 385,615 385,820 480,820" fill="none" stroke="#247a89" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)" /><polyline points="785,770 785,685" fill="none" stroke="#247a89" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)" /><polyline points="1180,770 1180,685" fill="none" stroke="#247a89" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)" /><text x="540" y="728" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">实线：访存连接；具体路径由指令、缓存命中与架构决定</text><text x="45" y="746" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#193247" font-weight="normal">LSU = Load / Store Units</text><text x="45" y="782" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">SM内部的访存执行单元</text><polyline points="50,830 150,830" fill="none" stroke="#8a64ad" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)" /><text x="165" y="837" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">提交 / 调度</text><polyline points="50,875 150,875" fill="none" stroke="#247a89" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)" /><text x="165" y="882" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#193247" font-weight="normal">数据访问 / 传输</text><rect x="40" y="945" width="1420" height="140" rx="13" fill="#ffffff" stroke="#b6cbd6" stroke-width="2"/><text x="58" y="977" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#193247" font-weight="bold">如何读这张图</text><text x="60" y="1009" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#193247" font-weight="normal">① L1 与 shared memory 分工不同：普通读取可进入寄存器；程序按需把数据分块暂存到 shared memory。</text><text x="60" y="1047" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#193247" font-weight="normal">② 计算结果可继续留在 GPU 被后续 kernel 使用；只有主机需要结果时，才安排回传。</text></svg>