<polyline points="550,199 550,233 550,233" fill="none" stroke="#27313e" stroke-width="2" stroke-linejoin="round"/>
<rect x="780" y="133" width="220" height="66" rx="11" fill="#e0f1e6" stroke="#16a34a" stroke-width="2"/>
<text x="890.0" y="174.16" text-anchor="middle" font-family="Microsoft YaHei, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#17202a">高层特征 · d</text>
<polyline points="890,199 890,233 550,233" fill="none" stroke="#27313e" stroke-width="2" stroke-linejoin="round"/>
