<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<title>EAGLE-3：多层特征融合与内部状态反馈</title>
<desc>a 是草稿内部向量；训练不要求它等于目标模型某一层的特征。。依据学习正文重绘；绿色为真实特征，蓝色为预测特征，灰色为模块或token。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="650" fill="white"/>
<rect x="8" y="8" width="1084" height="634" rx="20" fill="#fdfdfd" stroke="#dfe3e8"/>
<text x="36" y="49" text-anchor="start" font-family="Microsoft YaHei, DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#17202a">EAGLE-3：多层特征融合与内部状态反馈</text>
<text x="36" y="83" text-anchor="start" font-family="Microsoft YaHei, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#617080">a 是草稿内部向量；训练不要求它等于目标模型某一层的特征。</text>
