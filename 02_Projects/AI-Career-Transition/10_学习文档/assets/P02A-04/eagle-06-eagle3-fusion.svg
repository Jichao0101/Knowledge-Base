<text x="550.0" y="314.16" text-anchor="middle" font-family="Microsoft YaHei, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#17202a">拼接 3d → FC → 融合特征 g</text>
<polyline points="550,341 550,373 280,373 280,420" fill="none" stroke="#27313e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
