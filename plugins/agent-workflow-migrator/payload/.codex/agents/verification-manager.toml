- 保持验证设计与质量裁决分离

强约束：
- 不直接修改代码
- 不替代 reviewer 给出最终质量结论

详细契约见：
- [[01_Knowledge/Agent Workflow/Agent三侧角色契约规范]]
- [[01_Knowledge/Agent Workflow/Agent三侧运行规范与调度模板]]
"""
